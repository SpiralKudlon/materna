# ── Parsers – used by Fluent Bit ─────────────────────────────────────────────

# Docker JSON log format: {"log":"...","stream":"stdout","time":"..."}
[PARSER]
    Name        docker
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L
    Time_Keep   off
    # Decode escaped JSON inside the "log" field
    Decode_Field_As json log

# Fallback: plain text line with optional ISO timestamp prefix
[PARSER]
    Name        plain
    Format      regex
    Regex       ^(?<time>[^ ]+) (?<log>.+)$
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%LZ
