# ── Fluent Bit – Maternal System Log Aggregation ────────────────────────────
# Tails all Docker container logs from the host mount, parses them as JSON
# (or falls back to plain text), then ships them to Loki over HTTP.
# ─────────────────────────────────────────────────────────────────────────────

[SERVICE]
    Flush        5
    Daemon       off
    Log_Level    info
    Parsers_File parsers.conf

# ── INPUT: Docker container logs ─────────────────────────────────────────────
[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    DB                /var/log/flb_maternal.db
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   on
    Refresh_Interval  10

# ── FILTER: Add standard labels (container_name, job) ────────────────────────
[FILTER]
    Name          record_modifier
    Match         docker.*
    Record        job maternal-system
    Record        environment production

# Enrich with Docker metadata (image name, container name, etc.)
[FILTER]
    Name           docker_metadata
    Match          docker.*
    Docker_URL     unix:///var/run/docker.sock

# ── OUTPUT: Ship to Loki ──────────────────────────────────────────────────────
[OUTPUT]
    Name          loki
    Match         docker.*
    Host          loki
    Port          3100
    Labels        job=$job,container_name=$container_name,environment=$environment
    # Strip internal Fluent Bit metadata keys before shipping
    Remove_Keys   source
    Label_Keys    $level,$status_code
    Line_Format   json
