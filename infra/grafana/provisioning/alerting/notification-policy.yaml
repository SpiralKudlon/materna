apiVersion: 1

policies:
  - orgId: 1
    receiver: PagerDuty
    group_by:
      - alertname
      - severity
    group_wait: 30s         # wait before sending the first alert bundle
    group_interval: 5m      # how long to wait before re-sending grouped alerts
    repeat_interval: 1h     # silence repeat notification after 1 h if still firing
    routes:
      # Route critical SLA breaches specifically to PagerDuty
      - matchers:
          - severity = critical
        receiver: PagerDuty
        continue: false
